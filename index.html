<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bowling – Allenamenti</title>
<meta name="theme-color" content="#1f3a5f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Bowling">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<style>
  :root { --bg:#f3f5f8; --card:#fff; --ink:#1b2430; --muted:#5d6b7a; --brand:#1f3a5f;
          --green:#1e9e4a; --yellow:#e6b800; --red:#d62f2f; --off:#d9dee4; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; background:var(--bg); color:var(--ink); }
  header { background:var(--brand); color:#fff; padding:calc(14px + env(safe-area-inset-top)) 16px 14px; }
  header h1 { margin:0; font-size:1.2rem; }
  header .who { font-size:.9rem; opacity:.85; margin-top:2px; }
  main { max-width:520px; margin:0 auto; padding:16px; }
  .card { background:var(--card); border-radius:14px; padding:16px; margin-bottom:14px; box-shadow:0 1px 3px rgba(0,0,0,.08); }
  .card.picker { border:2px solid var(--brand); }
  .row { display:flex; align-items:center; justify-content:space-between; gap:12px; }
  .date { font-weight:700; font-size:1.05rem; }
  .sub { color:var(--muted); font-size:.88rem; margin-top:2px; }
  .count { font-size:1.9rem; font-weight:800; line-height:1; }
  .count small { font-size:.9rem; color:var(--muted); font-weight:600; }
  .light { display:flex; flex-direction:column; gap:4px; background:#222; padding:5px; border-radius:10px; }
  .light span { width:16px; height:16px; border-radius:50%; background:#444; }
  .light.red .r { background:var(--red); box-shadow:0 0 8px var(--red); }
  .light.yellow .y { background:var(--yellow); box-shadow:0 0 8px var(--yellow); }
  .light.green .g { background:var(--green); box-shadow:0 0 8px var(--green); }
  button { font:inherit; border:0; border-radius:10px; padding:12px 16px; font-weight:700; cursor:pointer; width:100%; margin-top:12px; }
  .btn-join { background:var(--brand); color:#fff; }
  .btn-cancel { background:#fff; color:var(--red); border:2px solid var(--red); }
  button:disabled { background:var(--off); color:var(--muted); border:0; cursor:default; }
  .mine { margin-top:10px; padding:8px 10px; background:#e7f5ec; border-radius:8px; color:#145c2e; font-weight:600; font-size:.92rem; }
  .msg { padding:12px 14px; border-radius:10px; margin-bottom:14px; font-weight:600; }
  .msg.ok { background:#e7f5ec; color:#145c2e; }
  .msg.err { background:#fdecec; color:#8f1d1d; }
  label { display:block; font-weight:600; margin:0 0 6px; }
  select { width:100%; font:inherit; padding:12px; border:1px solid #c7ced6; border-radius:10px; background:#fff; }
  .link { background:none; color:var(--muted); font-weight:500; text-decoration:underline; padding:6px; }
  .hidden { display:none; }
  .foot { text-align:center; color:var(--muted); font-size:.8rem; margin-top:8px; }
  .badge { display:inline-block; font-size:.78rem; font-weight:700; color:var(--brand);
           background:#e8eef6; border-radius:6px; padding:2px 7px; margin-top:6px; }
</style>
</head>
<body>
<header>
  <h1>🎳 Allenamenti Bowling</h1>
  <div class="who" id="who">Scegli il socio, poi aderisci</div>
</header>

<main>
  <div id="msg" class="msg hidden"></div>

  <!-- SCELTA DEL SOCIO: si rifà a ogni adesione -->
  <section class="card picker">
    <label for="memberSelect">Chi aderisce?</label>
    <select id="memberSelect"><option value="">Caricamento…</option></select>
    <div class="sub" id="pickerHint">La tendina si azzera dopo ogni operazione: per iscrivere una seconda persona basta sceglierla e aderire di nuovo.</div>
  </section>

  <!-- ALLENAMENTI -->
  <section id="trainings"></section>

  <div id="footer" class="foot">
    <div id="updated"></div>
    <button class="link" id="refreshBtn">Aggiorna</button>
  </div>
</main>

<script>
// ============ CONFIGURAZIONE ============
// Incolla qui l'URL della web app Apps Script (termina con /exec)
const API_URL = 'https://script.google.com/macros/s/AKfycbyj2WBN2apOS_LwZnVCeYVAHe4AAhp-8yeF7_0_vQBgDYEfqzlOd-iaPDoJkxbXR4Jtrw/exec';
const REFRESH_MS = 45000;

// ============ STATO ============
// Nessun dato viene salvato sul telefono: l'app è indipendente dal dispositivo.
let members = [];      // elenco soci attivi
let trainings = [];    // ultimo stato ricevuto dal server
let selectedId = '';   // socio scelto in questo momento
let busy = false;
let timer = null;

const $ = id => document.getElementById(id);
const selectedMember = () => members.find(m => m.id === selectedId) || null;

async function api(action, payload = {}) {
  // Richiesta GET con i parametri nell'indirizzo: è il formato che Apps Script
  // accetta senza complicazioni (niente preflight CORS, niente redirect su POST).
  const qs = new URLSearchParams({ action, ...payload, _: Date.now() });
  const res = await fetch(API_URL + '?' + qs, { method: 'GET', cache: 'no-store' });
  const text = await res.text();
  let data;
  try {
    data = JSON.parse(text);
  } catch (e) {
    // Google ha risposto con una pagina HTML invece dei dati: mostriamo di che pagina si tratta
    console.error('Risposta non JSON da ' + API_URL, res.status, text.slice(0, 500));
    throw new Error(diagnose_(res, text));
  }
  if (!data.ok) throw new Error(data.error || 'Errore sconosciuto');
  return data;
}

/** Traduce in italiano la pagina HTML restituita da Google. */
function diagnose_(res, text) {
  const t = text.toLowerCase();
  if (t.includes('accounts.google.com') || t.includes('sign in') || t.includes('accedi'))
    return 'Il deployment chiede l\'accesso a Google: imposta "Chi ha accesso: Chiunque" e ripubblica.';
  if (t.includes('script function not found'))
    return 'La versione pubblicata è vecchia: Gestisci deployment → Nuova versione.';
  if (t.includes('moved temporarily') || res.status === 404)
    return 'URL non valido (HTTP ' + res.status + '): controlla API_URL, deve essere quello attivo e finire con /exec.';
  return 'Risposta inattesa dal server (HTTP ' + res.status + '). Dettagli nella console del browser.';
}

function showMsg(text, kind = 'ok') {
  const el = $('msg');
  el.textContent = text;
  el.className = 'msg ' + kind;
  window.scrollTo({ top: 0, behavior: 'smooth' });
}
function clearMsg() { $('msg').className = 'msg hidden'; }

// ============ TENDINA SOCI ============
async function loadMembers() {
  const sel = $('memberSelect');
  try {
    const data = await api('members');
    members = data.members;
    if (!members.length) {
      sel.innerHTML = '<option value="">— nessun socio —</option>';
      return showMsg('L\'elenco soci è vuoto: il presidente deve inserire i nomi nella scheda "Soci" del foglio.', 'err');
    }
    fillSelect();
  } catch (e) {
    sel.innerHTML = '<option value="">— elenco non disponibile —</option>';
    showMsg('Impossibile caricare l\'elenco soci: ' + e.message, 'err');
  }
}

function fillSelect() {
  const sel = $('memberSelect');
  sel.innerHTML = '<option value="">— scegli il socio —</option>' + members.map(m =>
    `<option value="${esc(m.id)}">${esc(m.name)} (${esc(m.id)})</option>`
  ).join('');
  sel.value = selectedId;
}

function updateWho() {
  const m = selectedMember();
  $('who').textContent = m ? `Stai operando come ${m.name} · ${m.id}` : 'Scegli il socio, poi aderisci';
}

$('memberSelect').addEventListener('change', () => {
  selectedId = $('memberSelect').value;
  clearMsg();
  updateWho();
  render();
});

// ============ ALLENAMENTI ============
async function refresh() {
  if (busy) return;
  try {
    const data = await api('status');
    trainings = data.trainings;
    render();
    $('updated').textContent = 'Aggiornato alle ' + data.serverTime.slice(11);
  } catch (e) {
    showMsg('Connessione non riuscita: ' + e.message, 'err');
  }
}

function render() {
  const me = selectedMember();
  if (!trainings.length) {
    $('trainings').innerHTML = '<div class="card">Nessun allenamento in programma.</div>';
    return;
  }
  $('trainings').innerHTML = trainings.map(t => {
    const mine = me ? t.signups.find(s => s.userId === me.id) : null;
    let action;
    if (t.window === 'notYetOpen') {
      action = `<button disabled>Adesioni dal ${esc(t.opensAt)}</button>`;
    } else if (t.window === 'closed') {
      action = `<button disabled>Adesioni chiuse</button>`;
    } else if (!me) {
      action = `<button disabled>Scegli prima il socio</button>`;
    } else if (mine) {
      action = `<button class="btn-cancel" data-cancel="${esc(t.date)}" data-label="${esc(t.label)}">Annulla l'adesione di ${esc(me.name)}</button>`;
    } else if (t.count >= t.max) {
      action = `<button disabled>Posti esauriti</button>`;
    } else {
      action = `<button class="btn-join" data-join="${esc(t.date)}" data-label="${esc(t.label)}">Aderisci come ${esc(me.name)}</button>`;
    }
    return `
      <div class="card">
        <div class="row">
          <div>
            <div class="date">${esc(t.weekday)} ${esc(t.label)}</div>
            <div class="sub">Adesioni</div>
            <div class="count">${t.count} <small>/ ${t.max}</small></div>
            ${t.window === 'open' && t.customOpening ? '<div class="badge">apertura anticipata</div>' : ''}
          </div>
          <div class="light ${esc(t.light)}" aria-label="semaforo ${esc(t.light)}">
            <span class="r"></span><span class="y"></span><span class="g"></span>
          </div>
        </div>
        ${mine ? `<div class="mine">${esc(me.name)} è iscritto: numero ${mine.number}</div>` : ''}
        ${action}
      </div>`;
  }).join('');
}

$('trainings').addEventListener('click', async ev => {
  const btn = ev.target.closest('button');
  if (!btn || btn.disabled) return;
  const joinDate = btn.dataset.join;
  const cancelDate = btn.dataset.cancel;
  if (!joinDate && !cancelDate) return;

  const me = selectedMember();
  if (!me) return showMsg('Scegli prima il socio dalla tendina.', 'err');

  // Conferma con il nome bene in vista: è la difesa contro l'adesione fatta per la persona sbagliata.
  const domanda = joinDate
    ? `Confermi l'adesione di ${me.name} (${me.id}) all'allenamento del ${btn.dataset.label}?`
    : `Annullare l'adesione di ${me.name} (${me.id}) all'allenamento del ${btn.dataset.label}?`;
  if (!confirm(domanda)) return;

  busy = true;
  btn.disabled = true;
  btn.textContent = 'Invio in corso…';
  try {
    const data = await api(joinDate ? 'signup' : 'cancel',
      { memberId: me.id, date: joinDate || cancelDate });
    showMsg(data.message, 'ok');
    selectedId = '';           // il turno passa alla persona successiva
    $('memberSelect').value = '';
    updateWho();
  } catch (e) {
    showMsg(e.message, 'err');
  } finally {
    busy = false;
    refresh();
  }
});

$('refreshBtn').addEventListener('click', () => { clearMsg(); refresh(); });
document.addEventListener('visibilitychange', () => { if (!document.hidden) refresh(); });

function esc(s) {
  return String(s).replace(/[&<>"']/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]));
}

// ============ AVVIO ============
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
if (API_URL.startsWith('INCOLLA')) {
  showMsg('App non configurata: inserire API_URL in index.html.', 'err');
} else {
  loadMembers();
  refresh();
  timer = setInterval(() => { if (!document.hidden) refresh(); }, REFRESH_MS);
}
</script>
</body>
</html>
